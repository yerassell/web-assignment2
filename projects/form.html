        <h1 id="form-head">FORM</h1>
        <p>Please fill the form</p>
        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name" required/>
        <label for="email">Enter your email:</label>
        <input type="email" id="email" name="email" required/>
        <label for="dropdown">Select your role:</label>
            <select id="dropdown" name="dropdown">
                <option value="">Select one role</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="parent">Parent</option>
            </select>
        <label>Do you like this design??</label>
        <label for="yes">
        <input type="radio" value="yes" id="yes" name="yes/no" class="inline" required/>Yes</label>
        <label for="no">
        <input type="radio" value="no" id="no" name="yes/no" class="inline" required/>No</label>
        <label for="textholder">Your comment:</label>
        <textarea id="textholder" name="textholder" placeholder="Type something..." rows="5" cols="4"></textarea>
        <label for="button">
        <button type="submit" id="button" name="submit">Submit</button>
        
    </form>
